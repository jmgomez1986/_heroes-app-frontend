<nav aria-label="Miga de pan" class="flex min-w-0 items-center gap-0.5 text-sm">
  @for (segment of segments(); track $index; let last = $last) {
    @if (segment.link) {
      <a
        [routerLink]="segment.link"
        class="shrink-0 text-zinc-500 transition-colors hover:text-indigo-600"
      >
        {{ segment.label }}
      </a>
    } @else {
      <span class="truncate font-medium text-zinc-900">{{ segment.label }}</span>
    }
    @if (!last) {
      <mat-icon aria-hidden="true" class="!h-4 !w-4 text-zinc-400">chevron_right</mat-icon>
    }
  }
</nav>
