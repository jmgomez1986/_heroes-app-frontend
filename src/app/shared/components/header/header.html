<header class="sticky top-0 z-40 border-b border-zinc-200 bg-white shadow-sm">
  <div class="mx-auto flex h-14 max-w-7xl items-center gap-2 px-4 sm:gap-4 sm:px-6">
    <!-- Marca (S1): texto desde la constante única del componente. -->
    <a
      routerLink="/heroes"
      class="shrink-0 text-lg font-bold text-zinc-900 transition-colors hover:text-indigo-600"
    >
      {{ brandName }}
    </a>

    <nav class="ml-auto flex shrink-0 items-center gap-1 sm:gap-4" aria-label="Navegación principal">
      <a
        routerLink="/heroes"
        routerLinkActive="font-semibold text-indigo-600"
        [routerLinkActiveOptions]="{ exact: false }"
        class="rounded-md px-2 py-1 text-sm text-zinc-600 transition-colors hover:text-indigo-600"
      >
        Catálogo
      </a>
      <!-- En mobile el link de texto queda oculto: el CTA cubre la misma navegación (S1). -->
      <a
        routerLink="/new-hero"
        routerLinkActive="font-semibold text-indigo-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hidden rounded-md px-2 py-1 text-sm text-zinc-600 transition-colors hover:text-indigo-600 lg:block"
      >
        Nuevo Héroe
      </a>
      <!-- CTA indigo filled (S1): reemplaza al botón de alta de la página de catálogo. -->
      <button matButton="filled" routerLink="/new-hero" class="bg-indigo-600! text-white!">
        <mat-icon aria-hidden="true">add</mat-icon>
        Registrar Héroe
      </button>
    </nav>
  </div>
</header>
