<header class="sticky top-0 z-40 border-b border-zinc-200 bg-white shadow-sm">
  <div class="mx-auto flex h-14 max-w-7xl items-center gap-2 px-4 sm:gap-4 sm:px-6">
    <!-- Marca (S1): texto desde la constante única del componente. -->
    <a
      routerLink="/heroes"
      class="shrink-0 text-lg font-bold text-zinc-900 transition-colors hover:text-indigo-600"
    >
      {{ brandName }}
    </a>

    <nav
      class="ml-auto flex shrink-0 items-center gap-1 sm:gap-4"
      [aria-label]="i18n.ariaLabel.principalNav"
    >
      <a
        routerLink="/heroes"
        routerLinkActive="font-semibold text-indigo-600"
        [routerLinkActiveOptions]="{ exact: false }"
        class="rounded-md px-2 py-1 text-sm text-zinc-600 transition-colors hover:text-indigo-600"
      >
        {{i18n.links.catalog}}
      </a>
      <button
        matButton="filled"
        routerLink="/new-hero"
        class="h-8! shrink-0 rounded-full! bg-indigo-600! px-2.5! text-xs! text-white! sm:h-10! sm:px-4! sm:text-sm!"
      >
        <mat-icon
          aria-hidden="true"
          class="h-4! w-4! text-[16px]! leading-none! sm:h-5! sm:w-5! sm:text-[20px]!"
        >
          add
        </mat-icon>
        <span class="sm:hidden">{{i18n.buttons.addHeroMobile}}</span>
        <span class="hidden sm:inline">{{i18n.buttons.addHero}}</span>
      </button>
    </nav>
  </div>
</header>
