<div class="min-h-screen bg-linear-to-br from-slate-50 via-blue-50 to-purple-50">
  <div class="max-w-7xl mx-auto pt-6">
    <!-- Los filtros siempre estan visibles) -->
    <app-filters
      (nameFilterApplied)="applyNameFilter($event)"
      (aliasFilterApplied)="applyAliasFilter($event)"
    ></app-filters>

    <!-- Cuando esta en estado loaging, el spinner solo en aparece en la zona de resultados -->
    @if (heroesResource.isLoading()) {
      <div class="flex justify-center items-center h-64">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8 auto-rows-fr">
        @for (hero of heroesResource.value()?.data; track hero._id) {
          <app-hero-grid-card
            [hero]="hero"
            (heroDeleted)="refreshHeroes()"
            [isPriorityImg]="$index < 3"
          ></app-hero-grid-card>
        } @empty {
          <div class="col-span-full text-center text-gray-500 py-10">
            No se encontraron resultados.
          </div>
        }
      </div>
    }
  </div>

  <mat-paginator
    aria-label="Seleccionar página"
    [pageIndex]="currentPage() - 1"
    [length]="heroesResource.value()?.total_elements"
    [pageSize]="itemsPerPage()"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="handlePageEvent($event)"
  >
  </mat-paginator>
</div>
