<div class="min-h-screen">
  <div class="max-w-7xl mx-auto pt-3.5">
    <!-- Los filtros siempre estan visibles: hidratados desde la URL y escritos en ella al aplicar -->
    <app-filters
      [initialFilters]="filters()"
      (filtersChange)="applyFilters($event)"
      (refreshHeroes)="clearFilters()"
    ></app-filters>

    <!-- Fila de conteo + selector (componente reutilizable) sobre la grilla: el selector
         de items por página queda arriba (sin scroll para cambiarlo). El pill se oculta
         mientras carga y en error (sin datos que mostrar); el selector permanece. -->
    <app-hero-count-selector
      [shown]="countSummary()?.shown"
      [total]="countSummary()?.total"
      [pageSize]="pageSize()"
      [pageSizeOptions]="itemsPerPageOptions"
      (pageSizeChange)="handlePageSizeChange($event)"
    ></app-hero-count-selector>

    <!-- Cuando hay error del GET, el detalle va en el SweetAlert: la grilla muestra el estado vacío -->
    @if (heroesResource.error()) {
      <div class="col-span-full text-center text-zinc-500 py-10">
        {{ i18nTexts.messages.noResults }}
      </div>
    } @else if (heroesResource.isLoading()) {
      <div class="flex justify-center items-center h-64">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8 auto-rows-fr">
        @for (hero of heroesResource.value()?.data; track hero._id) {
          <app-hero-grid-card
            [hero]="hero"
            (heroDeleted)="refreshHeroes()"
            [isPriorityImg]="$index < 3"
          ></app-hero-grid-card>
        } @empty {
          <div class="col-span-full text-center text-zinc-500 py-10">
            {{ i18nTexts.messages.noResults }}
          </div>
        }
      </div>
    }

    <mat-paginator
      [aria-label]="i18nTexts.ariaLabel.pageSelection"
      [pageIndex]="currentPage() - 1"
      [length]="heroesResource.hasValue() ? heroesResource.value().total_elements : 0"
      [pageSize]="pageSize()"
      [pageSizeOptions]="itemsPerPageOptions"
      [hidePageSize]="true"
      (page)="handlePageEvent($event)"
    >
    </mat-paginator>
  </div>
</div>
