<div class="min-h-screen bg-zinc-50">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Encabezado de la página: el título del catálogo. El acceso a Home -->
    <div class="mb-6">
      <div class="flex flex-col items-center justify-center">
        <div class="flex items-center justify-center gap-2 sm:gap-3">
          <mat-icon
            aria-hidden="true"
            class="block! h-6! w-6! shrink-0! text-[24px]! leading-none! text-indigo-600! sm:h-8! sm:w-8! sm:text-[32px]!"
          >
            security
          </mat-icon>
          <h1
            class="m-0 text-center text-2xl font-bold leading-none text-zinc-900 sm:text-4xl sm:leading-tight"
          >
            Catálogo de Superhéroes
          </h1>
        </div>

        <div
          class="mx-auto mt-2 h-1.5 w-24 rounded-full bg-linear-to-r from-indigo-600 to-violet-500 sm:w-32"
        ></div>

        <p class="mt-4 px-2 text-center text-sm text-zinc-600 sm:text-lg">
          Descubre, explora y administra superhéroes y villanos
        </p>
      </div>
    </div>

    <!-- Contadores del catálogo (GET /heroes/stats): la sección se oculta si el
         endpoint falla o todavía no existe (degradación silenciosa). -->
    @if (showStats()) {
      <app-hero-stats [stats]="statsEntries()"></app-hero-stats>
    }

    <app-heroes-grid></app-heroes-grid>
  </div>
</div>
