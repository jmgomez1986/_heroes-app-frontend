<div class="min-h-screen bg-zinc-50">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Encabezado de la página: el título del catálogo vive acá. El acceso a Home
         y el CTA de alta viven en el header del shell, así que este bloque es estático. -->
    <div class="mb-6">
      <div class="flex flex-col items-center gap-3 justify-center">
        <div class="flex align-middle items-center gap-3 justify-center min-w-0 max-w-full">
          <mat-icon class="h-8! w-8! text-[32px]! text-indigo-600! shrink-0">security</mat-icon>
          <h1 class="text-4xl font-bold text-zinc-900 leading-tight">Catálogo de Superhéroes</h1>
        </div>
        <div
          class="mt-1 h-1.5 w-32 rounded-full bg-linear-to-r from-indigo-600 to-violet-500 mx-auto"
        ></div>
        <p class="mt-4 text-zinc-600 text-center text-sm sm:text-lg px-2">
          Descubre, explora y administra superhéroes y villanos
        </p>
      </div>
    </div>

    <!-- Contadores del catálogo (GET /heroes/stats): la sección se oculta si el
         endpoint falla o todavía no existe (degradación silenciosa). -->
    @if (showStats()) {
      <app-hero-stats [stats]="statsEntries()"></app-hero-stats>
    }

    <app-heroes-grid></app-heroes-grid>
  </div>
</div>
